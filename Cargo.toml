[package]
name = "kotlin-analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
chumsky = "0.12"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["io-std", "macros", "rt-multi-thread", "time"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
